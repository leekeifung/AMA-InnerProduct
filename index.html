<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMA1751 Linear Algebra — Topic 6: Inner Product (Interactive Lab)</title>

  <!-- KaTeX for fast mathematical typesetting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>

      /* PolyU-inspired academic palette */
      --polyu-red: #8B1E3F;
      --polyu-red-dark: #68132D;
      --polyu-red-soft: #FDF2F5;
      --accent-gold: #C59B27;

    .brand {
      background: linear-gradient(135deg, var(--polyu-red), var(--polyu-red-dark));

    /* Main Workspace */

    /* Reusable Academic UI Components */
    .module-header {

    .module-header h2 { margin: 0 0 8px; font-size: 1.6rem; color: #0F172A; }

    .card {

      border-radius: var(--radius);

    .card h3 {

    .grid-2 {
      display: grid;

    .callout {
      padding: 14px 16px;

    .callout.tip { border-left-color: var(--accent-teal); background: #F0FDFA; }

    .btn {

    .code-details {

    }
    .code-details summary {

    .code-details pre {

    .module-footer {
      display: flex;

    /* Responsive mobile drawer */
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,0.25); }
      .main-wrap { margin-left: 0; }
      .menu-btn { display: inline-block; }
    }

<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="course-tag">
        <span>PolyU AMA1751</span>
        <span>2026/27 Sem 1</span>
      </div>
      <h1>Topic 6: Inner Product</h1>
      <div class="lecturer">Lecturer: Dr. LEE Kei Fung, Charles</div>
    </div>

    <div class="progress-box">
      <div class="progress-meta">
        <span>Learning Progress</span>
        <span id="progressText">0 / 10</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <ul class="nav-list" id="navList"></ul>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuToggle">☰ Topics</button>
        <strong id="topbarTitle" style="font-size:0.95rem;">Overview</strong>
      </div>
      <div class="student-pill">
        <span id="studentDisplay">Guest Student</span>
        <button id="editProfileBtn" title="Set Student ID & Name for Quiz Records">Edit</button>
      </div>
    </header>

    <main class="content" id="appContent">
      <!-- Dynamic module content renders here -->
    </main>
  </div>

  <!-- =====================================================================
       CORE ENGINE: Linear Algebra Utilities (LA), URL Params, State & Router
       ===================================================================== -->
  <script>
    window.AMA1751 = (function () {
      const STORAGE_KEY = 'ama1751_topic6_state_v1';

      // 1. Parse URL Parameters (?module=1&studentId=...&name=...&seed=...&mode=practice&topics=...&count=10)
      const urlParams = new URLSearchParams(window.location.search);
      const params = {
        module: parseInt(urlParams.get('module'), 10) || 0,
        studentId: urlParams.get('studentId') || '',
        name: urlParams.get('name') || '',
        seed: urlParams.get('seed') || '',
        mode: urlParams.get('mode') || 'practice',
        topics: urlParams.get('topics') || '',
        count: parseInt(urlParams.get('count'), 10) || 10
      };

      // 2. Persistent Student State
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return {
            studentId: params.studentId || parsed.studentId || '',
            name: params.name || parsed.name || '',
            completed: parsed.completed || {},
            quizHistory: parsed.quizHistory || []
          };
        } catch (e) {
          return { studentId: params.studentId, name: params.name, completed: {}, quizHistory: [] };
        }
      }

      let state = loadState();
      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      // 3. Topic Catalog (Skeleton Metadata for all 10 sections)
      const catalog = [
        { id: 0, code: '★', title: 'Course Roadmap & Guide', slides: 'P. 1 / 55' },
        { id: 1, code: '1', title: 'Inner Product & Norm in ℝⁿ', slides: 'P. 2–4' },
        { id: 2, code: '2', title: 'Orthogonality', slides: 'P. 5–9' },
        { id: 3, code: '3', title: 'Orthogonal Subspace', slides: 'P. 10–14' },
        { id: 4, code: '4', title: 'Projection Matrices', slides: 'P. 15–16' },
        { id: 5, code: '5', title: 'Orthonormal Basis', slides: 'P. 17–24, 34' },
        { id: 6, code: '6', title: 'Gram-Schmidt & QR', slides: 'P. 25–33' },
        { id: 7, code: '7', title: 'Least Squares Solution', slides: 'P. 35–43' },
        { id: 8, code: '8', title: 'Symmetric Matrices', slides: 'P. 44–47' },
        { id: 9, code: '9', title: 'The Spectral Theorem', slides: 'P. 48–55' },
        { id: 10, code: 'Q', title: 'Overall Quiz & Results', slides: 'Comprehensive' }
      ];

      // Registry where Modules 1..10 attach their render/mount handlers
      const modules = {};
      let currentId = params.module;

      // 4. Built-in Linear Algebra Engine (LA) for all interactive labs
      const LA = {
        dot: (u, v) => u.reduce((s, x, i) => s + x * v[i], 0),
        norm: (v) => Math.sqrt(v.reduce((s, x) => s + x * x, 0)),
        scale: (c, v) => v.map(x => c * x),
        add: (u, v) => u.map((x, i) => x + v[i]),
        sub: (u, v) => u.map((x, i) => x - v[i]),
        normalize: (v) => {
          const n = LA.norm(v);
          return n > 1e-12 ? v.map(x => x / n) : v.map(() => 0);
        },
        transpose: (M) => M[0].map((_, j) => M.map(row => row[j])),
        matMul: (A, B) => {
          const m = A.length, n = B[0].length, k = B.length;
          return Array.from({ length: m }, (_, i) =>
            Array.from({ length: n }, (_, j) => {
              let sum = 0;
              for (let t = 0; t < k; t++) sum += A[i][t] * B[t][j];
              return sum;
            })
          );
        },
        matVec: (A, v) => A.map(row => LA.dot(row, v)),
        outer: (u, v) => u.map(ui => v.map(vj => ui * vj)),
        inv: (M) => {
          const n = M.length;
          const A = M.map((r, i) => [...r, ...Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))]);
          for (let col = 0; col < n; col++) {
            let pivot = col;
            for (let r = col + 1; r < n; r++) {
              if (Math.abs(A[r][col]) > Math.abs(A[pivot][col])) pivot = r;
            }
            if (Math.abs(A[pivot][col]) < 1e-10) return null; // Singular
            [A[col], A[pivot]] = [A[pivot], A[col]];
            const div = A[col][col];
            for (let j = 0; j < 2 * n; j++) A[col][j] /= div;
            for (let r = 0; r < n; r++) {
              if (r !== col) {
                const f = A[r][col];
                for (let j = 0; j < 2 * n; j++) A[r][j] -= f * A[col][j];
              }
            }
          }
          return A.map(r => r.slice(n));
        },
        gramSchmidt: (cols) => {
          const k = cols.length;
          const Y = [], U = [];
          const R = Array.from({ length: k }, () => Array(k).fill(0));
          for (let j = 0; j < k; j++) {
            let y = [...cols[j]];
            for (let i = 0; i < j; i++) {
              const rij = LA.dot(cols[j], U[i]);
              R[i][j] = rij;
              y = LA.sub(y, LA.scale(rij, U[i]));
            }
            const n = LA.norm(y);
            R[j][j] = n;
            Y.push(y);
            U.push(n > 1e-10 ? LA.scale(1 / n, y) : y.map(() => 0));
          }
          return { Y, U, Q: LA.transpose(U), R };
        },
        fmt: (x, digits = 3) => {
          if (Math.abs(x) < 1e-9) return '0';
          // Check simple fraction representation (denominators up to 12)
          for (let d = 1; d <= 12; d++) {
            const n = Math.round(x * d);
            if (Math.abs(x - n / d) < 1e-6) {
              return d === 1 ? `${n}` : `\\frac{${n}}{${d}}`;
            }
          }
          return Number(x.toFixed(digits)).toString();
        },
        vecTex: (v) => `\\begin{bmatrix} ${v.map(x => LA.fmt(x)).join(' \\\\ ')} \\end{bmatrix}`,
        matTex: (M) => `\\begin{bmatrix} ${M.map(r => r.map(x => LA.fmt(x)).join(' & ')).join(' \\\\ ')} \\end{bmatrix}`
      };

      // 5. KaTeX Helper
      function renderMath(rootEl = document.getElementById('appContent')) {
        if (window.renderMathInElement && rootEl) {
          window.renderMathInElement(rootEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }
      }

      // 6. UI Rendering & Navigation
      function updateStudentUI() {
        const el = document.getElementById('studentDisplay');
        if (state.studentId || state.name) {
          el.textContent = `${state.name || 'Student'}${state.studentId ? ' (' + state.studentId + ')' : ''}`;
        } else {
          el.textContent = 'Guest Student';
        }
      }

      function updateProgressUI() {
        const doneCount = Object.keys(state.completed).filter(k => state.completed[k]).length;
        document.getElementById('progressText').textContent = `${doneCount} / 10`;
        document.getElementById('progressBar').style.width = `${(doneCount / 10) * 100}%`;
      }

      function renderNav() {
        const ul = document.getElementById('navList');
        ul.innerHTML = catalog.map(item => {
          const isActive = item.id === currentId;
          const isDone = !!state.completed[item.id];
          const isBuilt = item.id === 0 || !!modules[item.id];
          return `
            <li class="nav-item ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}" data-id="${item.id}">
              <span class="nav-badge">${isDone ? '✓' : item.code}</span>
              <span style="flex:1;">${item.title}</span>
              <span class="nav-status">${isBuilt ? '' : 'Slot'}</span>
            </li>
          `;
        }).join('');

        ul.querySelectorAll('.nav-item').forEach(li => {
          li.addEventListener('click', () => {
            goTo(parseInt(li.dataset.id, 10));
            document.getElementById('sidebar').classList.remove('open');
          });
        });
      }

      function renderOverview() {
        const cards = catalog.slice(1).map(item => {
          const built = !!modules[item.id];
          const done = !!state.completed[item.id];
          return `
            <div class="card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span style="font-size:0.78rem; font-weight:700; color:var(--polyu-red); background:var(--polyu-red-soft); padding:2px 9px; border-radius:999px;">
                    ${item.id === 10 ? 'Assessment' : 'Part ' + item.id} · ${item.slides}
                  </span>
                  <span style="font-size:0.78rem; color:${done ? 'var(--accent-green)' : (built ? 'var(--accent-blue)' : 'var(--text-muted)')}; font-weight:600;">
                    ${done ? '✓ Completed' : (built ? 'Ready' : 'Skeleton Slot')}
                  </span>
                </div>
                <h3 style="border:none; padding:0; margin:4px 0 8px;">${item.title}</h3>
              </div>
              <button class="btn ${built ? 'btn-primary' : ''}" onclick="AMA1751.goTo(${item.id})" style="align-self:flex-start; margin-top:10px;">
                ${built ? 'Open Interactive Lab →' : 'Preview Slot →'}
              </button>
            </div>
          `;
        }).join('');

        return `
          <div class="module-header">
            <span class="slide-ref">AMA1751 Linear Algebra · PolyU Department of Applied Mathematics</span>
            <h2>Welcome to Topic 6: Inner Product — Interactive Companion</h2>
            <p>Explore the concepts, geometric visualizations, worked examples, and SymPy/NumPy workflows before and after lecture. Complete all 9 interactive parts, then test your mastery in the Overall Parameterized Quiz.</p>
          </div>
          <div class="callout tip">
            <strong>Active Session Parameters:</strong>
            Mode = <code>${params.mode}</code> ·
            Seed = <code>${params.seed || 'random'}</code> ·
            Quiz Questions = <code>${params.count}</code>
          </div>
          <div class="grid-2">${cards}</div>
        `;
      }

      function renderPlaceholder(meta) {
        return `
          <div class="module-header">
            <span class="slide-ref">Part ${meta.id} · Lecture Notes ${meta.slides}</span>
            <h2>${meta.title}</h2>
            <p>Interactive introduction, visual laboratory, worked examples, and Python/SymPy reference.</p>
          </div>
          <div class="card">
            <h3>Module ${meta.id} Ready for Content</h3>
            <p>This skeleton slot is wired to the navigation, KaTeX math renderer, Plotly 3D engine, and <code>LA</code> linear algebra core. Next, we will build and plug in the interactive lab and worked examples for <strong>${meta.title}</strong>.</p>
          </div>
        `;
      }

      function goTo(id) {
        currentId = id;
        const meta = catalog.find(c => c.id === id) || catalog[0];
        document.getElementById('topbarTitle').textContent = meta.title;

        const container = document.getElementById('appContent');
        if (id === 0) {
          container.innerHTML = renderOverview();
        } else if (modules[id]) {
          container.innerHTML = modules[id].render(meta, { LA, state, params });
          if (typeof modules[id].mount === 'function') {
            modules[id].mount(container, { LA, state, params, renderMath });
          }
        } else {
          container.innerHTML = renderPlaceholder(meta);
        }

        // Append prev / mark complete / next footer for modules 1..10
        if (id >= 1) {
          const isDone = !!state.completed[id];
          const footer = document.createElement('div');
          footer.className = 'module-footer';
          footer.innerHTML = `
            <button class="btn" onclick="AMA1751.goTo(${id - 1})">← Previous</button>
            <button class="btn ${isDone ? 'btn-success' : ''}" id="toggleDoneBtn">
              ${isDone ? '✓ Marked as Reviewed' : 'Mark Section Complete'}
            </button>
            ${id < 10 ? `<button class="btn btn-primary" onclick="AMA1751.goTo(${id + 1})">Next Section →</button>` : '<span></span>'}
          `;
          container.appendChild(footer);
          document.getElementById('toggleDoneBtn').addEventListener('click', () => {
            state.completed[id] = !state.completed[id];
            saveState();
            updateProgressUI();
            renderNav();
            goTo(id);
          });
        }

        renderNav();
        renderMath(container);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // 7. Public API for plugging in Modules 1..10
      function registerModule(id, def) {
        modules[id] = def;
      }

      // Boot sequence
      window.addEventListener('DOMContentLoaded', () => {
        updateStudentUI();
        updateProgressUI();

        document.getElementById('menuToggle').addEventListener('click', () => {
          document.getElementById('sidebar').classList.toggle('open');
        });

        document.getElementById('editProfileBtn').addEventListener('click', () => {
          const sid = prompt('Enter your PolyU Student ID (e.g., 26012345D):', state.studentId);
          if (sid !== null) state.studentId = sid.trim();
          const nm = prompt('Enter your Name:', state.name);
          if (nm !== null) state.name = nm.trim();
          saveState();
          updateStudentUI();
        });

        goTo(currentId);
      });

      return { registerModule, goTo, LA, renderMath, getState: () => state, saveState, params };
    })();
  </script>
