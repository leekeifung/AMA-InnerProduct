     * Core Linear Algebra Utility Library (Client-Side)
     */
    const LA = {
      dot: (x, y) => x.reduce((sum, xi, i) => sum + xi * y[i], 0),
      normSq: (x) => LA.dot(x, x),
      norm: (x) => Math.sqrt(LA.normSq(x)),
      scale: (x, c) => x.map(xi => xi * c),
      add: (x, y) => x.map((xi, i) => xi + y[i]),
      sub: (x, y) => x.map((xi, i) => xi - y[i]),
      proj: (x, y) => {
        const yy = LA.dot(y, y);
        if (yy === 0) return y.map(() => 0);
        return LA.scale(y, LA.dot(x, y) / yy);
      },
      // Greatest Common Divisor for exact fraction formatting
      gcd: (a, b) => {
        a = Math.abs(Math.round(a));
        b = Math.abs(Math.round(b));
        while (b) { [a, b] = [b, a % b]; }
        return a || 1;
      },
      // Format vector as LaTeX column matrix
      toLatexVec: (v, decimals = 2) => {
        const rows = v.map(val => Number.isInteger(val) ? val : Number(val.toFixed(decimals))).join(' \\\\ ');
        return `\\begin{bmatrix} ${rows} \\end{bmatrix}`;
      },
      // Seeded random generator for reproducible quiz parameters

        let h = 2166136261 >>> 0;
        for (let i = 0; i < seedStr.length; i++) {
          h = Math.imul(h ^ seedStr.charCodeAt(i), 16777619);
        }
        return function() {
          h += h << 13; h ^= h >>> 7;
          h += h << 3;  h ^= h >>> 17;
          return ((h += h << 5) >>> 0) / 4294967296;
        };
      }

                <pre id="m1-sympy-code" class="overflow-x-auto leading-relaxed"><span class="text-sky-400">import</span> sympy <span class="text-sky-400">as</span> sp

x = sp.Matrix([[1, 2, 3, 4, 5]]).T
y = sp.Matrix([[3, -1, 2, 1, -1]]).T

<span class="text-slate-400"># [3]: Inner product of x and y</span>
display(y.T @ x)      <span class="text-emerald-400"># Output: Matrix([[6]])</span>

<span class="text-slate-400"># [4]-[5]: Norm of x and y</span>
display(x.norm())     <span class="text-emerald-400"># Output: sqrt(55)</span>
display(y.norm())     <span class="text-emerald-400"># Output: 4</span>

<span class="text-slate-400"># [6]: Unit vector z = x / ||x||</span>
z = x / x.norm()</pre>
              </div>
            </div>
          </div>

          <!-- Section 4: Quick Concept Check for Module 1 -->
          <div class="bg-polyu-light/60 rounded-xl border border-rose-200 p-6">
            <h4 class="font-bold text-polyu text-base mb-2 flex items-center gap-2">
              <i data-lucide="help-circle" class="w-5 h-5"></i>
              Module 1 Concept Check
            </h4>
            <p class="text-sm text-slate-700 mb-3">
              Suppose $\\mathbf{x} = \\begin{bmatrix} 2 & -3 & 6 \\end{bmatrix}^T \\in \\mathbb{R}^3$. What is the norm $\\|\\mathbf{x}\\|$, and what is the third component of the unit vector $\\mathbf{u} = \\frac{1}{\\|\\mathbf{x}\\|}\\mathbf{x}$?
            </p>
            <div class="flex flex-wrap gap-3">
              <button onclick="M1.checkQuiz(1)" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm hover:border-polyu transition">
                A) $\\|\\mathbf{x}\\| = 49$, $u_3 = \\frac{6}{49}$
              </button>
              <button onclick="M1.checkQuiz(2)" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm hover:border-polyu transition">
                B) $\\|\\mathbf{x}\\| = 7$, $u_3 = \\frac{6}{7}$
              </button>
              <button onclick="M1.checkQuiz(3)" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm hover:border-polyu transition">
                C) $\\|\\mathbf{x}\\| = \\sqrt{31}$, $u_3 = \\frac{6}{\\sqrt{31}}$
              </button>
            </div>
            <div id="m1-quiz-feedback" class="hidden mt-3 p-3 rounded-lg text-xs font-medium"></div>
          </div>
        `;
      }
    };

    /**
     * Module 1 Interactive Controller
     */
    const M1 = {
      init: function() {
        this.updateCanvas();
        this.calcND();
        this.bindCanvasDrag();
      },
      loadSlide3Example: function() {
        document.getElementById('m1-nd-x').value = '1, 2, 3, 4, 5';
        document.getElementById('m1-nd-y').value = '3, -1, 2, 1, -1';
        this.calcND();
      },
      calcND: function() {
        const xStr = document.getElementById('m1-nd-x').value;
        const yStr = document.getElementById('m1-nd-y').value;
        const x = xStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
        const y = yStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
        const resEl = document.getElementById('m1-nd-result');

        if (x.length === 0 || x.length !== y.length) {
          resEl.innerHTML = `<span class="text-rose-600 font-semibold">Please enter two valid vectors of the same dimension (currently dim(x)=${x.length}, dim(y)=${y.length}).</span>`;
          return;
        }
        const ip = LA.dot(x, y);
        const nxSq = LA.normSq(x);
        const nySq = LA.normSq(y);
        const nx = Math.sqrt(nxSq);
        const ny = Math.sqrt(nySq);
        const z = nx > 0 ? x.map(xi => (xi / nx).toFixed(3)).join(', ') : 'Undefined (zero vector)';

        resEl.innerHTML = `
          <div><strong>Dimension:</strong> $\\mathbb{R}^{${x.length}}$</div>
          <div><strong>Inner Product $\\langle \\mathbf{x}, \\mathbf{y} \\rangle$:</strong> <span class="text-polyu font-bold">${ip}</span></div>
          <div><strong>Norm $\\|\\mathbf{x}\\|$:</strong> $\\sqrt{${nxSq}} \\approx ${nx.toFixed(4)}$ &nbsp;|&nbsp; <strong>Norm $\\|\\mathbf{y}\\|$:</strong> $\\sqrt{${nySq}} \\approx ${ny.toFixed(4)}$</div>
          <div><strong>Unit Vector $\\mathbf{z} = \\mathbf{x}/\\|\\mathbf{x}\\|$:</strong> $[${z}]^T$</div>
        `;
        App.renderMath(resEl);
      },
      updateCanvas: function() {
        const canvas = document.getElementById('m1-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const x1 = parseFloat(document.getElementById('m1-x1').value);
        const x2 = parseFloat(document.getElementById('m1-x2').value);
        const y1 = parseFloat(document.getElementById('m1-y1').value);
        const y2 = parseFloat(document.getElementById('m1-y2').value);

        document.getElementById('m1-x1-val').textContent = x1;
        document.getElementById('m1-x2-val').textContent = x2;
        document.getElementById('m1-y1-val').textContent = y1;
        document.getElementById('m1-y2-val').textContent = y2;

        const x = [x1, x2], y = [y1, y2], sum = [x1 + y1, x2 + y2];
        const nx = LA.norm(x), ny = LA.norm(y), nSum = LA.norm(sum);
        const ip = LA.dot(x, y);

        document.getElementById('m1-norm-x').textContent = nx.toFixed(2);
        document.getElementById('m1-norm-y').textContent = ny.toFixed(2);

        // Angle & Inner Product card
        let angleDeg = 0;
        if (nx > 0 && ny > 0) {
          const cosTheta = Math.max(-1, Math.min(1, ip / (nx * ny)));
          angleDeg = (Math.acos(cosTheta) * 180 / Math.PI);
        }
        const ipReadout = document.getElementById('m1-ip-readout');
        const ipDesc = document.getElementById('m1-ip-desc');
        const orient = ip > 1e-6 ? 'Acute' : (ip < -1e-6 ? 'Obtuse' : 'Orthogonal');
        ipReadout.textContent = `⟨x, y⟩ = ${ip.toFixed(2)} (${orient}: ${angleDeg.toFixed(1)}°)`;
        ipDesc.textContent = ip > 1e-6 
          ? 'Since ⟨x, y⟩ > 0, the angle between x and y is less than 90°.'
          : (ip < -1e-6 ? 'Since ⟨x, y⟩ < 0, the angle between x and y is greater than 90°.' : '⟨x, y⟩ = 0: Vectors x and y are orthogonal (90°).');

        // Triangle Inequality card
        document.getElementById('m1-tri-readout').textContent = `‖x + y‖ = ${nSum.toFixed(2)}  ≤  ‖x‖ + ‖y‖ = ${(nx + ny).toFixed(2)}`;
        document.getElementById('m1-tri-diff').textContent = `Slack: (‖x‖ + ‖y‖) − ‖x + y‖ = ${Math.max(0, nx + ny - nSum).toFixed(3)} ≥ 0`;

        // Draw Coordinate Grid
        const W = canvas.width, H = canvas.height;
        const ox = W / 2, oy = H / 2, scale = 34;
        ctx.clearRect(0, 0, W, H);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let gx = -7; gx <= 7; gx++) {
          ctx.beginPath(); ctx.moveTo(ox + gx * scale, 0); ctx.lineTo(ox + gx * scale, H); ctx.stroke();
        }
        for (let gy = -5; gy <= 5; gy++) {
          ctx.beginPath(); ctx.moveTo(0, oy + gy * scale); ctx.lineTo(W, oy + gy * scale); ctx.stroke();
        }

        // Axes
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();

        // Helper to draw arrow
        const drawVec = (fromX, fromY, toX, toY, color, label, dashed = false) => {
          const sx = ox + fromX * scale, sy = oy - fromY * scale;
          const ex = ox + toX * scale, ey = oy - toY * scale;
          const angle = Math.atan2(ey - sy, ex - sx);
          ctx.save();
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = dashed ? 1.8 : 2.8;
          if (dashed) ctx.setLineDash([5, 4]);
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
          if (!dashed && Math.hypot(ex - sx, ey - sy) > 5) {
            ctx.beginPath();
            ctx.moveTo(ex, ey);
            ctx.lineTo(ex - 10 * Math.cos(angle - 0.35), ey - 10 * Math.sin(angle - 0.35));
            ctx.lineTo(ex - 10 * Math.cos(angle + 0.35), ey - 10 * Math.sin(angle + 0.35));
            ctx.closePath();
            ctx.fill();
          }
          if (label) {
            ctx.font = 'bold 12px Inter, sans-serif';
            ctx.fillText(label, ex + 8 * Math.cos(angle), ey + 8 * Math.sin(angle));
          }
          ctx.restore();
        };

        // Draw parallelogram/triangle shifted y from tip of x (matching Slide 4 bottom-right diagram)
        drawVec(x1, x2, sum[0], sum[1], '#34d39988', '', true);
        drawVec(0, 0, x1, x2, '#60a5fa', 'x');
        drawVec(0, 0, y1, y2, '#34d399', 'y');
        drawVec(0, 0, sum[0], sum[1], '#fb7185', 'x + y');
      },
      bindCanvasDrag: function() {
        const canvas = document.getElementById('m1-canvas');
        if (!canvas) return;
        let dragging = null;
        const scale = 34;

        const getCoords = (e) => {
          const rect = canvas.getBoundingClientRect();
          const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
          const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
          return [(cx - canvas.width / 2) / scale, (canvas.height / 2 - cy) / scale];
        };

        canvas.addEventListener('pointerdown', (e) => {
          const [mx, my] = getCoords(e);
          const x1 = parseFloat(document.getElementById('m1-x1').value);
          const x2 = parseFloat(document.getElementById('m1-x2').value);
          const y1 = parseFloat(document.getElementById('m1-y1').value);
          const y2 = parseFloat(document.getElementById('m1-y2').value);
          if (Math.hypot(mx - x1, my - x2) < 0.6) dragging = 'x';
          else if (Math.hypot(mx - y1, my - y2) < 0.6) dragging = 'y';
        });

        window.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const [mx, my] = getCoords(e);
          const clamp = v => Math.max(-4, Math.min(4, Math.round(v * 2) / 2));
          if (dragging === 'x') {
            document.getElementById('m1-x1').value = clamp(mx);
            document.getElementById('m1-x2').value = clamp(my);
          } else {
            document.getElementById('m1-y1').value = clamp(mx);
            document.getElementById('m1-y2').value = clamp(my);
          }
          this.updateCanvas();
        });

        window.addEventListener('pointerup', () => { dragging = null; });
      },
      checkQuiz: function(choice) {
        const fb = document.getElementById('m1-quiz-feedback');
        fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-900', 'bg-rose-100', 'text-rose-900');
        if (choice === 2) {
          fb.classList.add('bg-emerald-100', 'text-emerald-900');
          fb.innerHTML = '✓ <strong>Correct!</strong> $\\|\\mathbf{x}\\| = \\sqrt{2^2 + (-3)^2 + 6^2} = \\sqrt{4 + 9 + 36} = \\sqrt{49} = 7$, so the third component of $\\mathbf{u} = \\frac{1}{7}\\mathbf{x}$ is $\\frac{6}{7}$.';
        } else {
          fb.classList.add('bg-rose-100', 'text-rose-900');
          fb.innerHTML = '✗ <strong>Not quite.</strong> Remember to square each entry (including $(-3)^2 = +9$) and take the square root: $\\|\\mathbf{x}\\| = \\sqrt{2^2 + (-3)^2 + 6^2} = \\sqrt{49} = 7$.';
        }
        App.renderMath(fb);
      }
    };

    /**
     * Main Application State & Router
     */
    const App = {
      state: {
        currentModule: 1,
        completed: [1],
        studentId: '',
        quizAttempts: []
      },

      init: function() {
        const saved = localStorage.getItem('AMA1751_Topic6_State');
        if (saved) {
          try { Object.assign(this.state, JSON.parse(saved)); } catch (e) {}
        }
        document.getElementById('student-id-input').value = this.state.studentId || '';
        this.renderNav();
        this.loadModule(this.state.currentModule || 1);
      },

      saveState: function() {
        localStorage.setItem('AMA1751_Topic6_State', JSON.stringify(this.state));
      },

      saveStudentProfile: function() {
        this.state.studentId = document.getElementById('student-id-input').value.trim();
        this.saveState();
      },

      resetProgress: function() {
        if (!confirm('Reset all saved progress and quiz records in this browser?')) return;
        localStorage.removeItem('AMA1751_Topic6_State');
        location.reload();
      },

      renderNav: function() {
        const nav = document.getElementById('nav-list');
        nav.innerHTML = MODULES.map(m => {
          const isCurrent = m.id === this.state.currentModule;
          const isDone = this.state.completed.includes(m.id);
          return `
            <button onclick="App.loadModule(${m.id})"
              class="w-full text-left px-3.5 py-2.5 rounded-lg flex items-center justify-between transition text-xs font-medium ${
                isCurrent ? 'bg-polyu text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'
              }">
              <div class="truncate pr-2">
                <div class="font-semibold truncate">${m.title}</div>
                <div class="text-[11px] ${isCurrent ? 'text-rose-100' : 'text-slate-400'}">Slides ${m.slides}</div>
              </div>
              <div class="shrink-0">
                ${isDone 
                  ? `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full ${isCurrent ? 'bg-white text-polyu' : 'bg-emerald-100 text-emerald-700'}">✓</span>`
                  : `<span class="inline-block w-2 h-2 rounded-full ${m.status === 'ready' ? 'bg-amber-400' : 'bg-slate-300'}"></span>`
                }
              </div>
            </button>
          `;
        }).join('');

        const doneCount = this.state.completed.length;
        document.getElementById('progress-text').textContent = `${doneCount} / ${MODULES.length} Modules`;
        document.getElementById('progress-bar').style.width = `${(doneCount / MODULES.length) * 100}%`;
        lucide.createIcons();
      },

      loadModule: function(id) {
        this.state.currentModule = id;
        this.saveState();
        this.renderNav();

        const mod = MODULES.find(m => m.id === id);
        document.getElementById('current-module-badge').textContent = `Module ${mod.id}`;
        document.getElementById('current-module-title').textContent = mod.title.replace(/^\d+\.\s*/, '');
        document.getElementById('current-slides-ref').textContent = `Lecture Notes: ${mod.slides} / 55`;

        document.getElementById('prev-btn').disabled = (id <= 1);
        document.getElementById('next-btn').disabled = (id >= MODULES.length);

        const viewport = document.getElementById('module-viewport');
        if (ModuleRenderers[id]) {
          viewport.innerHTML = ModuleRenderers[id]();
          if (id === 1) M1.init();
        } else {
          viewport.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 p-10 text-center space-y-4">
              <div class="w-12 h-12 rounded-full bg-polyu-light text-polyu flex items-center justify-center mx-auto font-bold text-lg">${mod.id}</div>
              <h3 class="text-xl font-bold text-slate-800">${mod.title}</h3>
              <p class="text-sm text-slate-600 max-w-xl mx-auto">
                Ready for step-by-step expansion (${mod.slides}). In our next step, we will plug in the interactive visualizers, proofs, worked examples, and SymPy/NumPy labs for this module!
              </p>
            </div>
          `;
        }
        this.renderMath(viewport);
        lucide.createIcons();
        viewport.scrollTop = 0;
      },

      navigate: function(delta) {
        const next = this.state.currentModule + delta;
        if (next >= 1 && next <= MODULES.length) this.loadModule(next);
      },

      markCurrentCompleted: function() {
        if (!this.state.completed.includes(this.state.currentModule)) {
          this.state.completed.push(this.state.currentModule);
          this.saveState();
          this.renderNav();
        }
      },

      renderMath: function(el) {
        if (window.renderMathInElement) {
          renderMathInElement(el || document.body, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }
      },

      copyCode: function(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
        alert('Python code copied to clipboard!');
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
